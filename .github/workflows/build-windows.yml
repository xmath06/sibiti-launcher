name: Build Windows Installer

# Build installer Windows (.msi + .exe) di runner GitHub (windows-latest).
# Tauri tidak bisa membungkus installer Windows dari macOS, sehingga kita
# membuild lewat CI. Hasil di-upload sebagai artifact (unduh dari tab Actions).
#
# Code-signing otomatis:
#   Jika repo memiliki secret WINDOWS_CODESIGN_PFX (base64 dari file .pfx
#   code-signing) dan WINDOWS_CODESIGN_PASSWORD, maka file .exe/.msi akan
#   ditandatangani dengan signtool (Authenticode + timestamp). Tanpa secret,
#   build tetap jalan menghasilkan installer TANPA tanda tangan.
#   Cara dapat sertifikat: beli dari CA (DigiCert/Sectigo) atau pakai
#   Azure Trusted Signing / SignPath (gratis untuk OSS).
#
# Diagnostik: bila build gagal, 150 baris terakhir log otomatis diumpan ke
# issue "CI build error (auto-diagnostic)" agar bisa dianalisis.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NSIS bundler tool
        continue-on-error: true
        run: choco install nsis -y

      - name: Install deps & Build Tauri (Windows)
        shell: pwsh
        run: |
          bun install *> build.log 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run tauri build *> build.log 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Run: ' + context.runId + '\n';
            const run = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            for (const job of run.data.jobs) {
              for (const step of job.steps || []) {
                if (step.conclusion === 'failure') {
                  body += '\n❌ Job "' + job.name + '" step "' + step.name + '" failed';
                }
              }
            }
            try {
              const log = fs.readFileSync('build.log', 'utf8');
              body += '\n\nbuild.log tail:\n' + log.split('\n').slice(-120).join('\n');
            } catch (e) {}
            let sha;
            try {
              const cur = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path: 'ci-diagnostic.txt'
              });
              sha = cur.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'ci-diagnostic.txt',
              message: 'ci diagnostic [skip ci]',
              content: Buffer.from(body).toString('base64'),
              sha: sha
            });

      - name: Sign Windows binaries
        if: ${{ secrets.WINDOWS_CODESIGN_PFX != '' && secrets.WINDOWS_CODESIGN_PASSWORD != '' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PASS: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $stPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.Windows.SDK `
            -find **/signtool.exe | Select-Object -First 1
          if (-not $stPath) { throw "signtool.exe tidak ditemukan" }
          $bytes = [System.Convert]::FromBase64String($env:PFX_B64)
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfx, $bytes)

          $files = Get-ChildItem src-tauri/target/release `
            -Recurse -Include *.exe,*.msi
          foreach ($f in $files) {
            Write-Host "Signing $($f.FullName)"
            & $stPath sign /f $pfx /p $env:PFX_PASS `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "CBT Launcher" $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Gagal menandatangani $($f.FullName)" }
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cbt-launcher-windows
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
