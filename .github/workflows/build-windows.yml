name: Build Windows Installer

# Build installer Windows (.msi + .exe) di runner GitHub (windows-latest).
# Tauri tidak bisa membungkus installer Windows dari macOS, sehingga kita
# membuild lewat CI runner Windows asli (MSVC + link.exe native).
#
# Hasil:
#   - Artifact "Sibiti-Launcher-Windows": installer NSIS (.exe) + WiX (.msi).
#     Installer BERSIFAT SELF-CONTAINED: backend & frontend CBT di-bundle ke
#     dalam installer, lalu ditarik ke direktori data aplikasi saat jalan
#     pertama (lihat extract_bundled di lib.rs).
#   - Artifact "CBT-Launcher-Portable": zip portabel berisi CBT Launcher.exe
#     + folder backend/ + frontend/ sebagai saudara, sehingga bisa dipindah
#     ke mana saja dan langsung dijalankan.
#
# Code-signing otomatis (opsional):
#   Jika repo punya secret WINDOWS_CODESIGN_PFX (base64 .pfx) dan
#   WINDOWS_CODESIGN_PASSWORD, maka .exe/.msi ditandatangani dengan signtool
#   (Authenticode + timestamp). Tanpa secret, installer tetap dihasilkan
#   (tidak ditandatangani).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Setup Rust (stable, Windows MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Alat bundler: NSIS (.exe) & WiX (.msi). Tauri v2 dapat memakai alat
      # yang di-bundle, tetapi memasangnya via choco menjamin ketersediaan.
      - name: Install Windows bundler tools
        continue-on-error: true
        run: choco install nsis wixtoolset -y

      # Ambil repo backend & frontend CBT (publik) ke folder saudara agar
      # bisa di-bundle sebagai resource. Dibersihkan dari node_modules/.git
      # agar installer tidak membengkak.
      - name: Fetch CBT backend & frontend
        shell: bash
        run: |
          git clone --depth 1 https://github.com/xmath06/sibitib.git "$GITHUB_WORKSPACE/backend"
          git clone --depth 1 https://github.com/xmath06/sibitif.git "$GITHUB_WORKSPACE/frontend"

      - name: Clean cloned deps (avoid bundling node_modules/.git)
        shell: bash
        run: |
          for d in "$GITHUB_WORKSPACE/backend" "$GITHUB_WORKSPACE/frontend"; do
            rm -rf "$d/.git"
            find "$d" -name node_modules -type d -prune -exec rm -rf {} +
          done
          rm -rf "$GITHUB_WORKSPACE/frontend/build" "$GITHUB_WORKSPACE/frontend/dist"

      # beforeBuildCommand di tauri.conf.json menjalankan "bun run build"
      # (build frontend launcher via Vite) sebelum Tauri membungkus.
      # backend/ & frontend/ CBT di-bundle sebagai resource (app/backend,
      # app/frontend) untuk installer self-contained.
      - name: Build frontend & Tauri (Windows)
        run: bun run tauri build

      # Penandatanganan otomatis (hanya jika secret tersedia; guard di dalam
      # script agar tidak pakai context secrets di dalam `if:`).
      - name: Sign Windows binaries
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PASS: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_B64 -or -not $env:PFX_PASS) {
            Write-Host "Tidak ada secret code-signing; lewati penandatanganan."
            exit 0
          }
          $stPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.Windows.SDK `
            -find **/signtool.exe | Select-Object -First 1
          if (-not $stPath) { throw "signtool.exe tidak ditemukan" }
          $bytes = [System.Convert]::FromBase64String($env:PFX_B64)
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfx, $bytes)

          $files = Get-ChildItem src-tauri/target/release `
            -Recurse -Include *.exe,*.msi
          foreach ($f in $files) {
            Write-Host "Signing $($f.FullName)"
            & $stPath sign /f $pfx /p $env:PFX_PASS `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "CBT Launcher" $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Gagal menandatangani $($f.FullName)" }
          }

      # Susun zip portabel: exe + backend/ + frontend/ sebagai saudara.
      - name: Assemble portable zip
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/CBT Launcher.exe"
          $out = "CBT-Launcher-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe $out
          Copy-Item "backend" "$out/backend" -Recurse
          Copy-Item "frontend" "$out/frontend" -Recurse
          Compress-Archive -Path "$out/*" -DestinationPath "CBT-Launcher-Portable.zip" -Force

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sibiti-Launcher-Windows
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: CBT-Launcher-Portable
          path: CBT-Launcher-Portable.zip
          if-no-files-found: error
